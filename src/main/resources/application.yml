spring:
  application:
    name: beverage-erp
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate 
    show-sql: true
    properties:
      hibernate:
        '[format_sql]': true
  flyway:
    enabled: true
    baseline-on-migrate: true
  jackson:
    serialization:
      write-dates-as-timestamps: false # Para que salgan como "2026-01-18T..."
    default-property-inclusion: non_null # No enviamos campos nulos para ahorrar ancho de banda
springdoc:
  show-login-endpoint: true
  default-produces-media-type: application/json

# --- PROPIEDADES PERSONALIZADAS DEL SISTEMA (Fuera de 'spring') ---
application:
  security:
    jwt:
      secret-key: ${JWT_KEY}
      expiration: ${APPLICATION_SECURITY_JWT_EXPIRATION}